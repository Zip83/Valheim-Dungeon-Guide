name: CI
run-name: CI build 0.1.0.${{ github.run_number }}

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  build:
    name: Build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      checks: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow version prefix
        shell: pwsh
        run: |
          [xml]$versionFile = Get-Content Version.props -Raw
          $expectedPrefix = [string]$versionFile.Project.PropertyGroup.VersionPrefix
          $workflow = Get-Content .github/workflows/ci.yml -Raw
          $match = [regex]::Match($workflow,
            '(?m)^run-name:[ \t]+CI build (?<prefix>[0-9]+\.[0-9]+\.[0-9]+)\.\$\{\{\s*github\.run_number\s*\}\}[ \t]*\r?$')
          if (!$match.Success) {
            throw 'CI run-name must contain a literal major.minor.patch prefix followed by github.run_number.'
          }

          $actualPrefix = $match.Groups['prefix'].Value
          if ($actualPrefix -cne $expectedPrefix) {
            throw "CI run-name prefix '$actualPrefix' does not match Version.props '$expectedPrefix'. Update both."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore Valheim.DungeonGuide.slnx --locked-mode

      - name: Check formatting
        run: dotnet format Valheim.DungeonGuide.slnx --no-restore --verify-no-changes --severity warn

      - name: Identify development build
        id: identity
        shell: pwsh
        run: |
          $identity = dotnet msbuild src/DungeonGuide/DungeonGuide.csproj -nologo `
            '-getProperty:Version,PluginVersion' `
            "-p:BuildNumber=$env:GITHUB_RUN_NUMBER" "-p:BuildAttempt=$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot determine build identity.'
          }
          $properties = ($identity | ConvertFrom-Json).Properties
          "version=$($properties.Version)" >> $env:GITHUB_OUTPUT
          "plugin_version=$($properties.PluginVersion)" >> $env:GITHUB_OUTPUT

      - name: Build
        id: compile
        shell: bash
        run: >-
          dotnet build Valheim.DungeonGuide.slnx --configuration Release --no-restore
          -p:BuildNumber="$GITHUB_RUN_NUMBER" -p:BuildAttempt="$GITHUB_RUN_ATTEMPT"
          -p:BuildCommit="$GITHUB_SHA"

      - name: Test domain behavior
        id: tests
        run: dotnet test Valheim.DungeonGuide.slnx --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/TestResults

      - name: Summarize test results
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Tests (${{ matrix.os }})
          path: artifacts/TestResults/**/*.trx
          reporter: dotnet-trx
          list-tests: failed
          use-actions-summary: 'true'
          report-title: Tests (${{ matrix.os }})
          fail-on-error: 'true'
          fail-on-empty: 'true'

      - name: Publish test check
        if: >-
          ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Tests (${{ matrix.os }})
          path: artifacts/TestResults/**/*.trx
          reporter: dotnet-trx
          list-tests: failed
          use-actions-summary: 'false'
          fail-on-error: 'true'
          fail-on-empty: 'true'

      - name: Prepare plugin artifact
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.identity.outputs.version }}
          PLUGIN_VERSION: ${{ steps.identity.outputs.plugin_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p artifacts/DungeonGuide/BepInEx/plugins/DungeonGuide/cs
          cp src/DungeonGuide/bin/Release/net48/DungeonGuide.dll src/DungeonGuide/bin/Release/net48/DungeonGuide.Domain.dll artifacts/DungeonGuide/BepInEx/plugins/DungeonGuide/
          cp src/DungeonGuide/bin/Release/net48/cs/DungeonGuide.Domain.resources.dll artifacts/DungeonGuide/BepInEx/plugins/DungeonGuide/cs/
          if [ -f src/DungeonGuide/bin/Release/net48/dungeonguide-ui ]; then
            cp src/DungeonGuide/bin/Release/net48/dungeonguide-ui artifacts/DungeonGuide/BepInEx/plugins/DungeonGuide/
          fi
          cp LICENSE artifacts/DungeonGuide/
          cp packaging/README.md artifacts/DungeonGuide/README.md
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "version": os.environ["BUILD_VERSION"],
              "pluginVersion": os.environ["PLUGIN_VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "pullRequest": os.environ.get("PR_NUMBER") or None,
              "runId": os.environ["GITHUB_RUN_ID"],
              "runNumber": os.environ["GITHUB_RUN_NUMBER"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "valheimTarget": "1.0.21",
              "channel": "development",
          }
          Path("artifacts/DungeonGuide/build-info.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload plugin artifact
        id: artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DungeonGuide-${{ steps.identity.outputs.version }}
          path: artifacts/DungeonGuide/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize build
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.identity.outputs.version }}
          PLUGIN_VERSION: ${{ steps.identity.outputs.plugin_version }}
          BUILD_RESULT: ${{ steps.compile.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          $commitUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
          @"
          ## Dungeon Guide $env:PLUGIN_VERSION

          | Build detail | Value |
          | --- | --- |
          | Version | $env:PLUGIN_VERSION |
          | Development version | $env:BUILD_VERSION |
          | Build number | $env:GITHUB_RUN_NUMBER |
          | Attempt | $env:GITHUB_RUN_ATTEMPT |
          | Platform | $env:RUNNER_OS |
          | Build result | $env:BUILD_RESULT |
          | Test result | $env:TEST_RESULT |
          | Commit | [$env:GITHUB_SHA]($commitUrl) |
          "@ >> $env:GITHUB_STEP_SUMMARY

          if ($env:ARTIFACT_URL) {
            "`n[Download plugin package]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          }

  result:
    name: CI result
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required build result
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$DETECTION_RESULT" != 'success' ]]; then exit 1; fi
          if [[ "$CODE_CHANGED" == 'true' && "$BUILD_RESULT" == 'success' ]]; then exit 0; fi
          if [[ "$CODE_CHANGED" == 'false' && "$BUILD_RESULT" == 'skipped' ]]; then
            echo 'Documentation/metadata only: build was not required.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1
